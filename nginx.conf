server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    # Server-level add_header is inherited by locations below because none of
    # them declare add_header of their own (cache lifetimes use `expires`).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed assets: effectively immutable.
    location /assets/ {
        expires 1y;
    }
    location /img/ {
        expires 7d;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }
}
